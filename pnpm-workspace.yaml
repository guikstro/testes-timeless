packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  baileys: set this to true or false
  bcrypt: true
  msgpackr-extract: true
  prisma: true
  protobufjs: set this to true or false
  sharp: true
  unrs-resolver: true
overrides:
  # O Baileys 6.7 aponta o libsignal para o GitHub, e o pnpm recusa dependência
  # vinda de git. A 6.0.0 é a mesma biblioteca, publicada no npm pelo mesmo
  # repositório (e é a que o Baileys 7 já usa).
  libsignal: "6.0.0"
