packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  # Negados de propósito: os scripts só conferem a versão do Node e avisam
  # sobre versão; nada é compilado. Menos script de terceiro rodando no build.
  baileys: false
  protobufjs: false
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  bcrypt: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true
overrides:
  # O Baileys 6.7 aponta o libsignal para o GitHub, e o pnpm recusa dependência
  # vinda de git. A 6.0.0 é a mesma biblioteca, publicada no npm pelo mesmo
  # repositório (e é a que o Baileys 7 já usa).
  libsignal: "6.0.0"
