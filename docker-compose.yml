services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tintim
      POSTGRES_PASSWORD: tintim
      POSTGRES_DB: tintim
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tintim"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Cópia de segurança do banco.
  #
  # Contêiner próprio com a imagem do Postgres, e não uma tarefa dentro da
  # API: assim o pg_dump é exatamente da mesma versão do servidor, e nenhuma
  # imagem da aplicação precisa carregar o cliente de banco. Se a API cair, a
  # cópia continua acontecendo.
  backup:
    # 17: o pg_dump precisa ser >= a versão do servidor (Supabase roda 15/17).
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # O mesmo banco da API (Supabase), lido do .env.
      DATABASE_URL: ${DATABASE_URL}
      # Uma cópia por dia, guardando as últimas trinta.
      BACKUP_INTERVAL_SECONDS: "86400"
      BACKUP_KEEP: "30"
    volumes:
      - ./docker/backup:/scripts:ro
      - backups:/backups
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # O produto é brasileiro e todo relatório é lido em horário de Brasília.
      # Sem isto o Node conta os dias em UTC, e um lead das 22h aparece no dia
      # seguinte no gráfico, no mapa de horários e na virada do mês.
      TZ: America/Sao_Paulo
      # O site fica na frente da API e repassa o IP de quem chamou. Sem este
      # salto de confiança, toda tentativa de login apareceria com o IP do
      # contêiner do site e o limite contaria todos os clientes juntos.
      TRUST_PROXY: "1"
      # DATABASE_URL vem do .env (Supabase).
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - /app/apps/api/node_modules
      - /app/node_modules
      # Imagens enviadas pelo cliente. Em volume, e não na imagem: sem isto a
      # logo de todo mundo sumiria a cada recriação do contêiner.
      - uploads:/app/uploads
    # `prisma:generate` antes de tudo: /app/node_modules é um volume anônimo,
    # então cada container carrega a sua própria cópia do Prisma Client. Sem
    # isto, uma alteração no schema deixa o client de um container obsoleto
    # enquanto o outro está em dia, e o sintoma não parece um problema de
    # build — a API falha ao compilar, passa a responder vazio, e o front
    # quebra ao tentar ler JSON de uma resposta sem corpo.
    # Tempo para as requisições em andamento terminarem e as conexões de tempo
    # real serem encerradas com ordem.
    stop_grace_period: 20s
    command: sh -c "pnpm --filter api prisma:generate && pnpm --filter api prisma:migrate:deploy && pnpm --filter api start:dev"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Server-side only (route handlers / Server Components run inside this
      # container), so this must resolve on the Docker network, not the host —
      # "localhost" here would point at the web container itself, not the api one.
      NEXT_PUBLIC_API_URL: http://api:3001/api
      # Endereço que o NAVEGADOR alcança, para o link do menu levar a lugar
      # nenhum dentro da rede do Docker.
      NEXT_PUBLIC_ADMIN_URL: ${ADMIN_APP_URL:-http://localhost:3002}
      TZ: America/Sao_Paulo
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/apps/web/node_modules
      - /app/node_modules
    command: sh -c "pnpm --filter web dev"

  # A administração da plataforma, num endereço próprio.
  #
  # Serviço separado, e não um caminho dentro do `web`, porque é disso que a
  # separação se trata: origem diferente significa cookie diferente, e uma
  # falha de script no site do cliente não alcança a sessão de quem opera a
  # plataforma inteira.
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Resolvido na rede do Docker: "localhost" aqui apontaria para o próprio
      # contêiner da administração, não para a api.
      NEXT_PUBLIC_API_URL: http://api:3001/api
      # Para onde mandar o navegador ao entrar num cliente. Este precisa ser o
      # endereço que o NAVEGADOR alcança, e não o da rede interna.
      NEXT_PUBLIC_WEB_APP_URL: ${WEB_APP_URL:-http://localhost:3000}
      TZ: America/Sao_Paulo
      PORT: 3002
    ports:
      - "3002:3002"
    depends_on:
      - api
    volumes:
      - ./apps/admin:/app/apps/admin
      - ./packages:/app/packages
      - /app/apps/admin/node_modules
      - /app/node_modules
    command: sh -c "pnpm --filter admin dev"

volumes:
  backups:
  uploads:
  postgres_data:
  redis_data:
