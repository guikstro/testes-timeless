services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tintim
      POSTGRES_PASSWORD: tintim
      POSTGRES_DB: tintim
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tintim"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Fase 8: motor do provider EVOLUTION (conexão por QR Code). Fica isolado
  # num container próprio de propósito — ele mantém a sessão do WhatsApp Web
  # viva, o que tornaria nosso worker stateful se fosse embutido. Ver
  # docs/WHATSAPP.md.
  evolution:
    # Namespace oficial atual do projeto: o antigo `atendai/evolution-api`
    # deixou de ser público. Tag fixa (não `latest`) para o build ser
    # reprodutível.
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-dev-evolution-key-change-me}
      # Persistência da sessão no mesmo Postgres, para o número não cair a
      # cada restart do container (sem isso, o QR precisa ser lido de novo).
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://tintim:tintim@postgres:5432/evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/2
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      # Só os eventos que este produto realmente consome — evita ruído e
      # trabalho inútil de rede a cada mudança de presença/typing.
      WEBHOOK_GLOBAL_ENABLED: "false"
      QRCODE_LIMIT: "10"
      LOG_LEVEL: ERROR
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - evolution_instances:/evolution/instances

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # O produto é brasileiro e todo relatório é lido em horário de Brasília.
      # Sem isto o Node conta os dias em UTC, e um lead das 22h aparece no dia
      # seguinte no gráfico, no mapa de horários e na virada do mês.
      TZ: America/Sao_Paulo
      DATABASE_URL: postgresql://tintim:tintim@postgres:5432/tintim
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - /app/apps/api/node_modules
      - /app/node_modules
    # `prisma:generate` antes de tudo: /app/node_modules é um volume anônimo,
    # então cada container carrega a sua própria cópia do Prisma Client. Sem
    # isto, uma alteração no schema deixa o client de um container obsoleto
    # enquanto o outro está em dia, e o sintoma não parece um problema de
    # build — a API falha ao compilar, passa a responder vazio, e o front
    # quebra ao tentar ler JSON de uma resposta sem corpo.
    command: sh -c "pnpm --filter api prisma:generate && pnpm --filter api prisma:migrate:deploy && pnpm --filter api start:dev"

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # O produto é brasileiro e todo relatório é lido em horário de Brasília.
      # Sem isto o Node conta os dias em UTC, e um lead das 22h aparece no dia
      # seguinte no gráfico, no mapa de horários e na virada do mês.
      TZ: America/Sao_Paulo
      DATABASE_URL: postgresql://tintim:tintim@postgres:5432/tintim
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - /app/apps/api/node_modules
      - /app/node_modules
    # Mesmo motivo do serviço `api` acima: volume anônimo, client próprio.
    command: sh -c "pnpm --filter api prisma:generate && pnpm --filter api start:worker:dev"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Server-side only (route handlers / Server Components run inside this
      # container), so this must resolve on the Docker network, not the host —
      # "localhost" here would point at the web container itself, not the api one.
      NEXT_PUBLIC_API_URL: http://api:3001/api
      TZ: America/Sao_Paulo
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/apps/web/node_modules
      - /app/node_modules
    command: sh -c "pnpm --filter web dev"

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
